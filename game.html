<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#6c5ce7">

  <title>KIDORA | قراءة القصة</title>

  <style>
    :root {
      --purple: #7657e8;
      --purple-dark: #5b42c7;
      --yellow: #ffd95a;
      --cream: #fffaf0;
      --white: #ffffff;
      --text: #29243f;
      --muted: #77738a;
      --radius: 25px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, #fff0a8, transparent 23%),
        radial-gradient(circle at 90% 20%, #dceeff, transparent 24%),
        linear-gradient(180deg, #fffaf0, #f5f1ff);

      color: var(--text);

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .container {
      width: min(850px, 92%);
      margin: auto;
    }

    /* HEADER */

    header {
      position: sticky;
      top: 0;
      z-index: 20;

      background: rgba(255,250,240,.9);
      backdrop-filter: blur(15px);

      border-bottom: 1px solid rgba(91,66,199,.08);
    }

    .header-inner {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 15px;
    }

    .logo {
      font-size: 23px;
      font-weight: 1000;
      color: var(--purple-dark);
      text-decoration: none;
    }

    .back {
      border: 0;
      background: white;
      color: var(--purple-dark);

      padding: 9px 14px;

      border-radius: 12px;

      font-weight: 900;

      box-shadow:
        0 6px 18px rgba(67,54,120,.08);
    }

    /* TOP */

    .story-top {
      padding: 35px 0 20px;
      text-align: center;
    }

    .category {
      display: inline-block;

      padding: 6px 12px;

      border-radius: 999px;

      background: #eeeaff;

      color: var(--purple-dark);

      font-size: 12px;
      font-weight: 900;
    }

    h1 {
      margin-top: 10px;

      font-size: clamp(30px, 6vw, 48px);

      line-height: 1.15;

      letter-spacing: -1px;
    }

    .subtitle {
      color: var(--muted);
      margin-top: 7px;
      font-size: 14px;
    }

    /* PROGRESS */

    .progress-area {
      margin: 20px 0;
    }

    .progress-info {
      display: flex;
      justify-content: space-between;

      color: var(--muted);

      font-size: 11px;

      margin-bottom: 7px;
    }

    .progress {
      height: 9px;

      background: #e9e5f5;

      border-radius: 999px;

      overflow: hidden;
    }

    .progress-bar {
      width: 20%;
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--purple),
          #9a7eff
        );

      border-radius: inherit;

      transition: width .35s ease;
    }

    /* SCENE */

    .scene {
      min-height: 310px;

      border-radius: 30px;

      display: grid;
      place-items: center;

      position: relative;

      overflow: hidden;

      box-shadow:
        0 18px 50px rgba(67,54,120,.12);

      background:
        linear-gradient(
          135deg,
          #e9ddff,
          #dff4ff
        );
    }

    .scene-emoji {
      font-size: 125px;

      animation:
        floating 3s ease-in-out infinite;
    }

    @keyframes floating {
      50% {
        transform: translateY(-10px);
      }
    }

    .star {
      position: absolute;
      font-size: 22px;
      animation: twinkle 2s infinite;
    }

    .s1 {
      top: 35px;
      left: 13%;
    }

    .s2 {
      top: 70px;
      right: 15%;
      animation-delay: .5s;
    }

    .s3 {
      bottom: 45px;
      left: 23%;
      animation-delay: 1s;
    }

    .s4 {
      bottom: 65px;
      right: 25%;
      animation-delay: 1.5s;
    }

    @keyframes twinkle {
      50% {
        opacity: .35;
        transform: scale(.8);
      }
    }

    /* STORY */

    .story-card {
      background: white;

      margin-top: 20px;

      border-radius: 28px;

      padding: 28px;

      box-shadow:
        0 15px 45px rgba(67,54,120,.1);
    }

    .story-text {
      font-size: 21px;

      line-height: 2;

      min-height: 150px;

      text-align: right;
    }

    .story-text strong {
      color: var(--purple);
    }

    /* CHOICES */

    .choices {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin-top: 25px;
    }

    .choice {
      border: 2px solid #e8e3f5;

      background: #faf9ff;

      color: var(--text);

      padding: 14px;

      border-radius: 15px;

      font-weight: 900;

      transition: .2s ease;
    }

    .choice:hover {
      border-color: var(--purple);

      background: #f2efff;

      transform: translateY(-2px);
    }

    /* CONTROLS */

    .controls {
      display: flex;

      justify-content: space-between;

      gap: 12px;

      margin: 20px 0 50px;
    }

    .control {
      border: 0;

      border-radius: 14px;

      padding: 13px 22px;

      font-weight: 950;
    }

    .previous {
      background: white;

      color: var(--purple-dark);

      box-shadow:
        0 7px 20px rgba(67,54,120,.08);
    }

    .next {
      background:
        linear-gradient(
          135deg,
          var(--purple),
          var(--purple-dark)
        );

      color: white;

      box-shadow:
        0 10px 25px rgba(108,92,231,.25);
    }

    .next:disabled,
    .previous:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    /* FOOTER */

    footer {
      background: #292348;

      color: white;

      padding: 25px 0;

      text-align: center;

      font-size: 12px;
    }

    footer span {
      color: #bdb7d7;
    }

    /* MOBILE */

    @media(max-width:600px) {

      .story-card {
        padding: 20px;
      }

      .scene {
        min-height: 230px;
      }

      .scene-emoji {
        font-size: 90px;
      }

      .story-text {
        font-size: 18px;
        line-height: 1.9;
      }

      .choices {
        grid-template-columns: 1fr;
      }

      .controls {
        position: sticky;
        bottom: 10px;

        background: rgba(255,250,240,.92);

        backdrop-filter: blur(10px);

        padding: 8px;

        border-radius: 16px;
      }

      .control {
        width: 50%;
      }

    }

  </style>
</head>

<body>

<header>

  <div class="container header-inner">

    <a
      href="index.html"
      class="logo"
    >
      📖 KIDORA
    </a>

    <button
      class="back"
      onclick="goHome()"
    >
      ← العودة للقصص
    </button>

  </div>

</header>


<main>

  <div class="container">

    <!-- TITLE -->

    <section class="story-top">

      <span class="category" id="category">
        🌙 رمضان
      </span>

      <h1 id="storyTitle">
        الهلال الصغير
      </h1>

      <p
        class="subtitle"
        id="subtitle"
      >
        قصة قصيرة للأطفال
      </p>

    </section>


    <!-- PROGRESS -->

    <div class="progress-area">

      <div class="progress-info">

        <span id="pageNumber">
          الصفحة 1 من 5
        </span>

        <span id="languageLabel">
          العربية
        </span>

      </div>

      <div class="progress">

        <div
          class="progress-bar"
          id="progressBar"
        ></div>

      </div>

    </div>


    <!-- SCENE -->

    <section
      class="scene"
      id="scene"
    >

      <span class="star s1">✨</span>
      <span class="star s2">⭐</span>
      <span class="star s3">✨</span>
      <span class="star s4">⭐</span>

      <div
        class="scene-emoji"
        id="sceneEmoji"
      >
        🌙
      </div>

    </section>


    <!-- STORY -->

    <section class="story-card">

      <div
        class="story-text"
        id="storyText"
      ></div>


      <div
        class="choices"
        id="choices"
      ></div>

    </section>


    <!-- CONTROLS -->

    <div class="controls">

      <button
        class="control previous"
        id="previousBtn"
        onclick="previousPage()"
      >
        ← السابق
      </button>

      <button
        class="control next"
        id="nextBtn"
        onclick="nextPage()"
      >
        التالي →
      </button>

    </div>

  </div>

</main>


<footer>

  <div class="container">

    KIDORA 📖

    <br>

    <span>
      عالم القصص الممتعة للأطفال
    </span>

  </div>

</footer>


<script>

  /*
  ==========================================
  قصة: الهلال الصغير
  ==========================================
  */

  const story = [

    {
      emoji: "🌙",

      text:
        "كان آدم يقف بجانب نافذة البيت وينظر إلى السماء. كان ينتظر شيئًا مهمًا جدًا... <strong>هلال رمضان.</strong>",

      choices: []
    },


    {
      emoji: "👦",

      text:
        "قال آدم لأمه: <strong>هل ظهر الهلال؟</strong><br><br>ابتسمت أمه وقالت: \"انظر جيدًا، ربما تراه قبل الجميع!\"",

      choices: []
    },


    {
      emoji: "🔭",

      text:
        "أخذ آدم منظاره الصغير وصعد إلى مكان مرتفع. نظر إلى السماء مرة... ثم مرة أخرى... وفجأة رأى شيئًا لامعًا.",

      choices: []
    },


    {
      emoji: "🌙✨",

      text:
        "<strong>لقد وجدته!</strong><br><br>كان الهلال الصغير يلمع في السماء. ركض آدم إلى أمه وهو يضحك من شدة الفرح.",

      choices: [
        {
          text: "🎉 أخبر الجميع",
          action: "celebrate"
        },
        {
          text: "🤫 احتفظ بالسر",
          action: "secret"
        }
      ]
    },


    {
      emoji: "❤️",

      text:
        "أخبر آدم عائلته، ثم قال: <strong>\"أجمل شيء في رمضان أن نفرح معًا ونساعد بعضنا.\"</strong><br><br>ومنذ ذلك اليوم أصبح آدم ينتظر رمضان ليس فقط لرؤية الهلال، بل ليفعل الخير أيضًا.",

      choices: []
    }

  ];


  let currentPage = 0;


  /*
  ==========================================
  عناصر الصفحة
  ==========================================
  */

  const storyText =
    document.getElementById("storyText");

  const sceneEmoji =
    document.getElementById("sceneEmoji");

  const progressBar =
    document.getElementById("progressBar");

  const pageNumber =
    document.getElementById("pageNumber");

  const previousBtn =
    document.getElementById("previousBtn");

  const nextBtn =
    document.getElementById("nextBtn");

  const choices =
    document.getElementById("choices");


  /*
  ==========================================
  عرض الصفحة
  ==========================================
  */

  function renderPage() {

    const page =
      story[currentPage];

    storyText.innerHTML =
      page.text;

    sceneEmoji.textContent =
      page.emoji;

    pageNumber.textContent =
      "الصفحة " +
      (currentPage + 1) +
      " من " +
      story.length;


    const percentage =
      ((currentPage + 1) / story.length) * 100;

    progressBar.style.width =
      percentage + "%";


    previousBtn.disabled =
      currentPage === 0;


    if (
      currentPage === story.length - 1
    ) {

      nextBtn.textContent =
        "↻ قراءة من البداية";

    } else {

      nextBtn.textContent =
        "التالي →";

    }


    choices.innerHTML = "";


    if (
      page.choices &&
      page.choices.length
    ) {

      page.choices.forEach(choice => {

        const button =
          document.createElement("button");

        button.className =
          "choice";

        button.textContent =
          choice.text;

        button.onclick =
          () => choose(choice.action);

        choices.appendChild(button);

      });

    }

  }


  /*
  ==========================================
  التالي
  ==========================================
  */

  function nextPage() {

    if (
      currentPage >= story.length - 1
    ) {

      currentPage = 0;

    } else {

      currentPage++;

    }

    renderPage();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
  ==========================================
  السابق
  ==========================================
  */

  function previousPage() {

    if (currentPage > 0) {

      currentPage--;

      renderPage();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }

  }


  /*
  ==========================================
  الاختيارات
  ==========================================
  */

  function choose(action) {

    if (action === "celebrate") {

      alert(
        "🎉 أحسنت!\nآدم شارك فرحته مع عائلته."
      );

    }


    if (action === "secret") {

      alert(
        "😊 اختيار جميل، لكن مشاركة الفرح مع من نحب أجمل."
      );

    }

  }


  /*
  ==========================================
  العودة
  ==========================================
  */

  function goHome() {

    window.location.href =
      "index.html";

  }


  /*
  ==========================================
  البداية
  ==========================================
  */

  renderPage();

</script>

</body>
</html>
