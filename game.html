<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>KIDORA - قراءة القصة</title>

  <meta name="description"
        content="اقرأ واستمع إلى قصص KIDORA للأطفال بالعربية والإنجليزية.">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">

  <div class="container nav-wrap">

    <a href="index.html" class="logo">
      KIDORA
    </a>

    <nav class="main-nav">
      <a href="index.html#stories">القصص</a>
      <a href="index.html#categories">التصنيفات</a>
      <a href="index.html#ramadan">رمضان</a>
      <a href="index.html#about">عن KIDORA</a>
    </nav>

    <div class="nav-actions">

      <button id="languageToggle" type="button">
        English
      </button>

      <button id="menuToggle" type="button">
        ☰
      </button>

    </div>

  </div>

  <div id="mobileMenu" class="mobile-menu">

    <a href="index.html#stories">
      القصص
    </a>

    <a href="index.html#categories">
      التصنيفات
    </a>

    <a href="index.html#ramadan">
      رمضان
    </a>

    <a href="index.html#about">
      عن KIDORA
    </a>

  </div>

</header>


<main>

<section class="story-reader">

  <div class="container">

    <a href="index.html" class="back-button">
      ← العودة إلى القصص
    </a>


    <div class="story-header">

      <div id="storyIcon" class="story-big-icon">
        📖
      </div>

      <div>

        <div id="storyCategory"
             class="story-category">
          قصة
        </div>

        <h1 id="storyTitle">
          القصة
        </h1>

        <p id="storyDescription">
          قصة ممتعة للأطفال
        </p>

      </div>

    </div>


    <div class="story-progress">

      <div class="progress-info">

        <span id="pageNumber">
          1 / 1
        </span>

        <span id="progressPercent">
          0%
        </span>

      </div>

      <div class="progress-bar">

        <div id="progressFill"
             class="progress-fill">
        </div>

      </div>

    </div>


    <article class="story-page">

      <div id="pageEmoji"
           class="story-page-emoji">
        📖
      </div>

      <p id="pageText"
         class="story-page-text">
        جارٍ تحميل القصة...
      </p>

    </article>


    <!-- أدوات الصوت -->

    <div class="audio-controls">

      <button id="playButton"
              type="button"
              class="audio-button primary">
        ▶️ استمع للقصة
      </button>

      <button id="stopButton"
              type="button"
              class="audio-button">
        ⏹️ إيقاف
      </button>

    </div>


    <!-- أدوات القراءة -->

    <div class="reader-controls">

      <button id="fontDecrease"
              type="button">
        A−
      </button>

      <span>
        حجم الخط
      </span>

      <button id="fontIncrease"
              type="button">
        A+
      </button>

      <button id="favoriteButton"
              type="button">
        ♡
      </button>

    </div>


    <div class="story-navigation">

      <button id="previousButton"
              type="button"
              class="nav-story-button">

        ← السابق

      </button>


      <button id="nextButton"
              type="button"
              class="nav-story-button primary">

        التالي →

      </button>

    </div>


    <section id="finishSection"
             class="finish-section"
             style="display:none;">

      <div class="finish-icon">
        🎉
      </div>

      <h2 id="finishTitle">
        أحسنت!
      </h2>

      <p id="finishText">
        لقد أكملت القصة.
      </p>

      <button id="nextStoryButton"
              type="button"
              class="nav-story-button primary">

        قصة أخرى →

      </button>

    </section>

  </div>

</section>

</main>


<footer class="site-footer">

  <div class="container">

    <div class="footer-logo">
      KIDORA
    </div>

    <p>
      © <span data-year></span> KIDORA
    </p>

    <div class="footer-links">

      <a href="privacy.html">
        الخصوصية
      </a>

      <a href="contact.html">
        تواصل معنا
      </a>

    </div>

  </div>

</footer>


<script src="games.js"></script>


<script>

document.addEventListener("DOMContentLoaded", function () {

  /*
   * ==============================
   * إعدادات اللغة
   * ==============================
   */

  let language =
    localStorage.getItem("kidora_lang") || "ar";


  /*
   * ==============================
   * اختيار القصة
   * ==============================
   */

  const params =
    new URLSearchParams(window.location.search);

  let storyId =
    params.get("story");


  if (!storyId) {

    storyId =
      localStorage.getItem("kidora_last_story");

  }


  let story =
    STORIES.find(function(item) {
      return item.id === storyId;
    });


  if (!story) {
    story = STORIES[0];
  }


  let currentPage = parseInt(
    localStorage.getItem(
      "kidora_page_" + story.id
    ) || "0"
  );


  if (isNaN(currentPage)) {
    currentPage = 0;
  }


  if (currentPage < 0) {
    currentPage = 0;
  }


  if (currentPage >= story.pages.length) {
    currentPage = story.pages.length - 1;
  }


  /*
   * ==============================
   * العناصر
   * ==============================
   */

  const storyIcon =
    document.getElementById("storyIcon");

  const storyCategory =
    document.getElementById("storyCategory");

  const storyTitle =
    document.getElementById("storyTitle");

  const storyDescription =
    document.getElementById("storyDescription");

  const pageEmoji =
    document.getElementById("pageEmoji");

  const pageText =
    document.getElementById("pageText");

  const pageNumber =
    document.getElementById("pageNumber");

  const progressPercent =
    document.getElementById("progressPercent");

  const progressFill =
    document.getElementById("progressFill");

  const previousButton =
    document.getElementById("previousButton");

  const nextButton =
    document.getElementById("nextButton");

  const playButton =
    document.getElementById("playButton");

  const stopButton =
    document.getElementById("stopButton");

  const fontDecrease =
    document.getElementById("fontDecrease");

  const fontIncrease =
    document.getElementById("fontIncrease");

  const favoriteButton =
    document.getElementById("favoriteButton");

  const finishSection =
    document.getElementById("finishSection");

  const finishTitle =
    document.getElementById("finishTitle");

  const finishText =
    document.getElementById("finishText");

  const nextStoryButton =
    document.getElementById("nextStoryButton");

  const languageToggle =
    document.getElementById("languageToggle");


  /*
   * ==============================
   * التصنيفات
   * ==============================
   */

  const categories = {

    ar: {
      ramadan: "رمضان",
      bedtime: "قبل النوم",
      animals: "الحيوانات",
      adventures: "المغامرات",
      world: "حول العالم",
      learning: "التعلم"
    },

    en: {
      ramadan: "Ramadan",
      bedtime: "Bedtime",
      animals: "Animals",
      adventures: "Adventures",
      world: "Around the World",
      learning: "Learning"
    }

  };


  /*
   * ==============================
   * تحديث اتجاه الموقع
   * ==============================
   */

  function updateLanguageDirection() {

    document.documentElement.lang =
      language;

    document.documentElement.dir =
      language === "ar"
        ? "rtl"
        : "ltr";

    if (languageToggle) {

      languageToggle.textContent =
        language === "ar"
          ? "English"
          : "العربية";

    }

  }


  /*
   * ==============================
   * عرض القصة
   * ==============================
   */

  function renderStory() {

    updateLanguageDirection();


    storyIcon.textContent =
      story.icon || "📖";


    storyCategory.textContent =
      categories[language][story.cat] ||
      story.cat;


    storyTitle.textContent =
      story.title[language];


    storyDescription.textContent =
      story.desc[language];


    const page =
      story.pages[currentPage];


    pageEmoji.textContent =
      page[0];


    pageText.textContent =
      page[language === "ar" ? 1 : 2];


    pageNumber.textContent =
      `${currentPage + 1} / ${story.pages.length}`;


    const percent =
      Math.round(
        ((currentPage + 1) /
        story.pages.length) * 100
      );


    progressPercent.textContent =
      percent + "%";


    progressFill.style.width =
      percent + "%";


    previousButton.disabled =
      currentPage === 0;


    if (currentPage === story.pages.length - 1) {

      nextButton.textContent =
        language === "ar"
          ? "إنهاء القصة ✓"
          : "Finish story ✓";

    } else {

      nextButton.textContent =
        language === "ar"
          ? "التالي →"
          : "Next →";

    }


    localStorage.setItem(
      "kidora_last_story",
      story.id
    );


    localStorage.setItem(
      "kidora_last_page",
      currentPage
    );


    localStorage.setItem(
      "kidora_page_" + story.id,
      currentPage
    );


    updateFavoriteButton();

    updateFinishSection();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  }


  /*
   * ==============================
   * الصوت
   * ==============================
   */

  function stopVoice() {

    if (
      "speechSynthesis" in window
    ) {

      speechSynthesis.cancel();

    }

  }


  function speakCurrentPage() {

    if (
      !("speechSynthesis" in window)
    ) {

      alert(
        language === "ar"
          ? "متصفحك لا يدعم القراءة الصوتية."
          : "Your browser does not support speech."
      );

      return;

    }


    stopVoice();


    const text =
      story.pages[currentPage][
        language === "ar" ? 1 : 2
      ];


    const speech =
      new SpeechSynthesisUtterance(text);


    speech.lang =
      language === "ar"
        ? "ar-SA"
        : "en-US";


    speech.rate = 0.9;

    speech.pitch = 1;

    speech.volume = 1;


    speech.onstart = function() {

      playButton.textContent =
        language === "ar"
          ? "🔊 جارٍ القراءة..."
          : "🔊 Reading...";

    };


    speech.onend = function() {

      playButton.textContent =
        language === "ar"
          ? "▶️ استمع للقصة"
          : "▶️ Listen";

    };


    speech.onerror = function() {

      playButton.textContent =
        language === "ar"
          ? "▶️ استمع للقصة"
          : "▶️ Listen";

    };


    speechSynthesis.speak(speech);

  }


  playButton.addEventListener(
    "click",
    speakCurrentPage
  );


  stopButton.addEventListener(
    "click",
    function() {

      stopVoice();

      playButton.textContent =
        language === "ar"
          ? "▶️ استمع للقصة"
          : "▶️ Listen";

    }
  );


  /*
   * ==============================
   * التالي
   * ==============================
   */

  nextButton.addEventListener(
    "click",
    function() {

      stopVoice();


      if (
        currentPage <
        story.pages.length - 1
      ) {

        currentPage++;

        renderStory();

      } else {

        localStorage.setItem(
          "kidora_completed_" + story.id,
          "true"
        );

        updateFinishSection();

      }

    }
  );


  /*
   * ==============================
   * السابق
   * ==============================
   */

  previousButton.addEventListener(
    "click",
    function() {

      stopVoice();


      if (currentPage > 0) {

        currentPage--;

        renderStory();

      }

    }
  );


  /*
   * ==============================
   * قصة أخرى
   * ==============================
   */

  nextStoryButton.addEventListener(
    "click",
    function() {

      stopVoice();


      const currentIndex =
        STORIES.findIndex(
          function(item) {
            return item.id === story.id;
          }
        );


      let nextIndex =
        currentIndex + 1;


      if (
        nextIndex >= STORIES.length
      ) {

        nextIndex = 0;

      }


      const nextStory =
        STORIES[nextIndex];


      localStorage.setItem(
        "kidora_last_story",
        nextStory.id
      );


      localStorage.setItem(
        "kidora_last_page",
        "0"
      );


      window.location.href =
        "game.html?story=" +
        encodeURIComponent(nextStory.id);

    }
  );


  /*
   * ==============================
   * المفضلة
   * ==============================
   */

  function getFavorites() {

    try {

      return JSON.parse(
        localStorage.getItem(
          "kidora_favorites"
        ) || "[]"
      );

    } catch (error) {

      return [];

    }

  }


  function updateFavoriteButton() {

    const favorites =
      getFavorites();


    const isFavorite =
      favorites.includes(story.id);


    favoriteButton.textContent =
      isFavorite ? "♥" : "♡";

  }


  favoriteButton.addEventListener(
    "click",
    function() {

      let favorites =
        getFavorites();


      if (favorites.includes(story.id)) {

        favorites =
          favorites.filter(
            function(id) {
              return id !== story.id;
            }
          );

      } else {

        favorites.push(story.id);

      }


      localStorage.setItem(
        "kidora_favorites",
        JSON.stringify(favorites)
      );


      updateFavoriteButton();

    }
  );


  /*
   * ==============================
   * حجم الخط
   * ==============================
   */

  let fontSize =
    parseInt(
      localStorage.getItem(
        "kidora_font_size"
      ) || "24"
    );


  function updateFontSize() {

    pageText.style.fontSize =
      fontSize + "px";


    localStorage.setItem(
      "kidora_font_size",
      fontSize
    );

  }


  fontDecrease.addEventListener(
    "click",
    function() {

      fontSize -= 2;

      if (fontSize < 16) {
        fontSize = 16;
      }

      updateFontSize();

    }
  );


  fontIncrease.addEventListener(
    "click",
    function() {

      fontSize += 2;

      if (fontSize > 40) {
        fontSize = 40;
      }

      updateFontSize();

    }
  );


  /*
   * ==============================
   * إنهاء القصة
   * ==============================
   */

  function updateFinishSection() {

    const completed =
      localStorage.getItem(
        "kidora_completed_" + story.id
      ) === "true";


    const isLastPage =
      currentPage ===
      story.pages.length - 1;


    if (completed || isLastPage) {

      finishSection.style.display =
        "block";


      finishTitle.textContent =
        language === "ar"
          ? "🎉 أحسنت!"
          : "🎉 Well done!";


      finishText.textContent =
        language === "ar"
          ? "لقد وصلت إلى نهاية القصة."
          : "You reached the end of the story.";


    } else {

      finishSection.style.display =
        "none";

    }

  }


  /*
   * ==============================
   * زر اللغة
   * ==============================
   */

  languageToggle.addEventListener(
    "click",
    function() {

      stopVoice();


      language =
        language === "ar"
          ? "en"
          : "ar";


      localStorage.setItem(
        "kidora_lang",
        language
      );


      renderStory();

    }
  );


  /*
   * ==============================
   * القائمة على الهاتف
   * ==============================
   */

  const menuToggle =
    document.getElementById(
      "menuToggle"
    );

  const mobileMenu =
    document.getElementById(
      "mobileMenu"
    );


  if (
    menuToggle &&
    mobileMenu
  ) {

    menuToggle.addEventListener(
      "click",
      function() {

        mobileMenu.classList.toggle(
          "open"
        );

      }
    );


    mobileMenu
      .querySelectorAll("a")
      .forEach(function(link) {

        link.addEventListener(
          "click",
          function() {

            mobileMenu.classList.remove(
              "open"
            );

          }
        );

      });

  }


  /*
   * ==============================
   * لوحة المفاتيح
   * ==============================
   */

  document.addEventListener(
    "keydown",
    function(event) {

      if (event.key === "ArrowRight") {

        if (language === "ar") {

          nextButton.click();

        } else {

          previousButton.click();

        }

      }


      if (event.key === "ArrowLeft") {

        if (language === "ar") {

          previousButton.click();

        } else {

          nextButton.click();

        }

      }


      if (event.key === " ") {

        event.preventDefault();

        speakCurrentPage();

      }

    }
  );


  /*
   * ==============================
   * السنة
   * ==============================
   */

  document
    .querySelectorAll("[data-year]")
    .forEach(function(element) {

      element.textContent =
        new Date().getFullYear();

    });


  /*
   * ==============================
   * تشغيل الموقع
   * ==============================
   */

  updateFontSize();

  renderStory();

});

</script>

</body>
</html>
