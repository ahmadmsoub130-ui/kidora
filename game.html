<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KIDORA - قراءة القصة</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ============================= -->
  <!-- Header -->
  <!-- ============================= -->

  <header class="site-header">

    <div class="container header-inner">

      <a href="index.html" class="logo">
        <span class="logo-icon">📚</span>
        <span>KIDORA</span>
      </a>

      <div class="reader-header-actions">

        <button
          id="languageToggle"
          class="language-btn"
          type="button"
        >
          English
        </button>

        <a
          href="index.html"
          class="back-home"
          data-ar="القصص"
          data-en="Stories"
        >
          القصص
        </a>

      </div>

    </div>

  </header>


  <!-- ============================= -->
  <!-- Reader -->
  <!-- ============================= -->

  <main class="reader-page">

    <div class="container">

      <!-- Story information -->

      <section class="reader-intro">

        <div
          id="storyCategory"
          class="reader-category"
        >
          📖
        </div>

        <h1 id="storyTitle">
          القصة
        </h1>

        <p id="storyDescription">
          ...
        </p>

      </section>


      <!-- Progress -->

      <section class="reader-progress">

        <div class="progress-info">

          <span id="pageCounter">
            1 / 1
          </span>

          <span id="progressPercent">
            0%
          </span>

        </div>

        <div class="progress-bar">

          <div
            id="progressFill"
            class="progress-fill"
          ></div>

        </div>

      </section>


      <!-- Story -->

      <section class="story-reader-card">

        <div
          id="storyScene"
          class="story-scene"
        >
          🌙
        </div>

        <div
          id="storyText"
          class="story-text"
        >
          ...
        </div>

        <div class="reader-controls">

          <button
            id="previousButton"
            class="reader-btn secondary"
            type="button"
          >
            ← السابق
          </button>

          <button
            id="favoriteButton"
            class="favorite-btn"
            type="button"
          >
            ♡
          </button>

          <button
            id="nextButton"
            class="reader-btn primary"
            type="button"
          >
            التالي →
          </button>

        </div>

      </section>


      <!-- Font controls -->

      <section class="reader-tools">

        <span
          class="tools-title"
          data-ar="حجم النص"
          data-en="Text size"
        >
          حجم النص
        </span>

        <button
          id="fontSmall"
          type="button"
        >
          A
        </button>

        <button
          id="fontMedium"
          type="button"
          class="selected"
        >
          A+
        </button>

        <button
          id="fontLarge"
          type="button"
        >
          A++
        </button>

      </section>


      <!-- Finish -->

      <section
        id="storyFinished"
        class="story-finished"
        style="display:none;"
      >

        <div class="finish-icon">
          🎉
        </div>

        <h2
          data-ar="أحسنت!"
          data-en="Well done!"
        >
          أحسنت!
        </h2>

        <p
          data-ar="لقد أكملت القصة."
          data-en="You finished the story."
        >
          لقد أكملت القصة.
        </p>

        <button
          id="nextStoryButton"
          class="reader-btn primary"
          type="button"
        >
          قصة أخرى
        </button>

      </section>

    </div>

  </main>


  <!-- ============================= -->
  <!-- Footer -->
  <!-- ============================= -->

  <footer class="site-footer">

    <div class="container">

      <div class="footer-logo">
        📚 KIDORA
      </div>

      <p>
        <span
          data-ar="قصص جميلة للأطفال في كل وقت."
          data-en="Beautiful stories for children."
        >
          قصص جميلة للأطفال في كل وقت.
        </span>
      </p>

      <div class="footer-links">

        <a
          href="index.html"
          data-ar="الرئيسية"
          data-en="Home"
        >
          الرئيسية
        </a>

        <a
          href="privacy.html"
          data-ar="الخصوصية"
          data-en="Privacy"
        >
          الخصوصية
        </a>

        <a
          href="contact.html"
          data-ar="تواصل معنا"
          data-en="Contact"
        >
          تواصل معنا
        </a>

      </div>

      <p class="copyright">
        © <span data-year></span> KIDORA
      </p>

    </div>

  </footer>


  <!-- Story database -->
  <script src="games.js"></script>

  <!-- Main application -->
  <script src="app.js"></script>


  <!-- Reader system -->
  <script>

    document.addEventListener("DOMContentLoaded", () => {

      // =====================================
      // Get story
      // =====================================

      const params = new URLSearchParams(
        window.location.search
      );

      let storyId =
        params.get("story");

      if (!storyId) {
        storyId =
          localStorage.getItem("kidora_last_story");
      }

      if (!storyId) {
        storyId = STORIES[0].id;
      }

      let story =
        STORIES.find(item => item.id === storyId);

      if (!story) {
        story = STORIES[0];
        storyId = story.id;
      }


      // =====================================
      // Language
      // =====================================

      let language =
        localStorage.getItem("kidora_lang") || "ar";


      // =====================================
      // Current page
      // =====================================

      let currentPage =
        parseInt(
          localStorage.getItem(
            `kidora_page_${story.id}`
          ) || "0"
        );

      if (
        isNaN(currentPage) ||
        currentPage < 0 ||
        currentPage >= story.pages.length
      ) {
        currentPage = 0;
      }


      // =====================================
      // Elements
      // =====================================

      const title =
        document.getElementById("storyTitle");

      const description =
        document.getElementById("storyDescription");

      const category =
        document.getElementById("storyCategory");

      const scene =
        document.getElementById("storyScene");

      const text =
        document.getElementById("storyText");

      const previous =
        document.getElementById("previousButton");

      const next =
        document.getElementById("nextButton");

      const pageCounter =
        document.getElementById("pageCounter");

      const progressPercent =
        document.getElementById("progressPercent");

      const progressFill =
        document.getElementById("progressFill");

      const favorite =
        document.getElementById("favoriteButton");

      const finished =
        document.getElementById("storyFinished");

      const nextStory =
        document.getElementById("nextStoryButton");


      // =====================================
      // Categories
      // =====================================

      const categories = {

        ar: {
          ramadan: "رمضان",
          bedtime: "قبل النوم",
          animals: "الحيوانات",
          adventures: "مغامرات",
          world: "حول العالم",
          learning: "تعلم"
        },

        en: {
          ramadan: "Ramadan",
          bedtime: "Bedtime",
          animals: "Animals",
          adventures: "Adventures",
          world: "Around the World",
          learning: "Learning"
        }

      };


      // =====================================
      // Update language
      // =====================================

      function updateLanguage() {

        document.documentElement.lang =
          language;

        document.documentElement.dir =
          language === "ar"
            ? "rtl"
            : "ltr";

        title.textContent =
          story.title[language];

        description.textContent =
          story.description[language];

        category.textContent =
          `${story.icon} ${
            categories[language][story.cat]
          }`;

        document
          .querySelectorAll(
            "[data-ar][data-en]"
          )
          .forEach(element => {

            element.textContent =
              language === "ar"
                ? element.dataset.ar
                : element.dataset.en;

          });

        const languageButton =
          document.getElementById(
            "languageToggle"
          );

        if (languageButton) {

          languageButton.textContent =
            language === "ar"
              ? "English"
              : "العربية";

        }

        updateReader();
      }


      // =====================================
      // Render page
      // =====================================

      function updateReader() {

        const page =
          story.pages[currentPage];

        if (!page) return;

        scene.textContent =
          page[0];

        text.textContent =
          language === "ar"
            ? page[1]
            : page[2];


        // Page counter

        pageCounter.textContent =
          `${currentPage + 1} / ${story.pages.length}`;


        // Progress

        const percent =
          Math.round(
            ((currentPage + 1) /
              story.pages.length) * 100
          );

        progressPercent.textContent =
          `${percent}%`;

        progressFill.style.width =
          `${percent}%`;


        // Previous

        previous.disabled =
          currentPage === 0;


        // Next text

        if (
          currentPage ===
          story.pages.length - 1
        ) {

          next.textContent =
            language === "ar"
              ? "إنهاء القصة"
              : "Finish Story";

        } else {

          next.textContent =
            language === "ar"
              ? "التالي →"
              : "Next →";

        }


        // Save progress

        localStorage.setItem(
          "kidora_last_story",
          story.id
        );

        localStorage.setItem(
          `kidora_page_${story.id}`,
          currentPage
        );

        localStorage.setItem(
          "kidora_last_page",
          currentPage
        );

        updateFavorite();

      }


      // =====================================
      // Next
      // =====================================

      next.addEventListener(
        "click",
        () => {

          if (
            currentPage <
            story.pages.length - 1
          ) {

            currentPage++;

            updateReader();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          } else {

            finished.style.display =
              "block";

            finished.scrollIntoView({
              behavior: "smooth"
            });

            localStorage.setItem(
              `kidora_completed_${story.id}`,
              "true"
            );

          }

        }
      );


      // =====================================
      // Previous
      // =====================================

      previous.addEventListener(
        "click",
        () => {

          if (currentPage > 0) {

            currentPage--;

            updateReader();

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });

          }

        }
      );


      // =====================================
      // Favorite
      // =====================================

      function getFavorites() {

        try {

          return JSON.parse(
            localStorage.getItem(
              "kidora_favorites"
            ) || "[]"
          );

        } catch {

          return [];

        }

      }


      function updateFavorite() {

        const favorites =
          getFavorites();

        const isFavorite =
          favorites.includes(story.id);

        favorite.textContent =
          isFavorite ? "♥" : "♡";

        favorite.classList.toggle(
          "active",
          isFavorite
        );

        favorite.title =
          language === "ar"
            ? (
              isFavorite
                ? "إزالة من المفضلة"
                : "إضافة للمفضلة"
            )
            : (
              isFavorite
                ? "Remove from favorites"
                : "Add to favorites"
            );
      }


      favorite.addEventListener(
        "click",
        () => {

          let favorites =
            getFavorites();

          if (
            favorites.includes(story.id)
          ) {

            favorites =
              favorites.filter(
                id => id !== story.id
              );

          } else {

            favorites.push(story.id);

          }

          localStorage.setItem(
            "kidora_favorites",
            JSON.stringify(favorites)
          );

          updateFavorite();

        }
      );


      // =====================================
      // Font size
      // =====================================

      const small =
        document.getElementById("fontSmall");

      const medium =
        document.getElementById("fontMedium");

      const large =
        document.getElementById("fontLarge");


      function setFontSize(size) {

        text.classList.remove(
          "font-small",
          "font-medium",
          "font-large"
        );

        text.classList.add(
          `font-${size}`
        );

        localStorage.setItem(
          "kidora_font_size",
          size
        );

        [small, medium, large]
          .forEach(button => {
            button.classList.remove(
              "selected"
            );
          });

        if (size === "small") {
          small.classList.add("selected");
        }

        if (size === "medium") {
          medium.classList.add("selected");
        }

        if (size === "large") {
          large.classList.add("selected");
        }

      }


      small.addEventListener(
        "click",
        () => setFontSize("small")
      );

      medium.addEventListener(
        "click",
        () => setFontSize("medium")
      );

      large.addEventListener(
        "click",
        () => setFontSize("large")
      );


      // =====================================
      // Next story
      // =====================================

      nextStory.addEventListener(
        "click",
        () => {

          const currentIndex =
            STORIES.findIndex(
              item => item.id === story.id
            );

          const nextIndex =
            (currentIndex + 1) %
            STORIES.length;

          const newStory =
            STORIES[nextIndex];

          localStorage.setItem(
            "kidora_last_story",
            newStory.id
          );

          localStorage.setItem(
            `kidora_page_${newStory.id}`,
            "0"
          );

          window.location.href =
            `game.html?story=${encodeURIComponent(
              newStory.id
            )}`;

        }
      );


      // =====================================
      // Language button
      // =====================================

      const languageToggle =
        document.getElementById(
          "languageToggle"
        );

      if (languageToggle) {

        languageToggle.addEventListener(
          "click",
          () => {

            language =
              language === "ar"
                ? "en"
                : "ar";

            localStorage.setItem(
              "kidora_lang",
              language
            );

            updateLanguage();

          }
        );

      }


      // =====================================
      // Keyboard navigation
      // =====================================

      document.addEventListener(
        "keydown",
        event => {

          if (event.key === "ArrowRight") {

            if (language === "ar") {
              previous.click();
            } else {
              next.click();
            }

          }

          if (event.key === "ArrowLeft") {

            if (language === "ar") {
              next.click();
            } else {
              previous.click();
            }

          }

        }
      );


      // =====================================
      // Initial font
      // =====================================

      const savedFont =
        localStorage.getItem(
          "kidora_font_size"
        ) || "medium";

      setFontSize(savedFont);


      // =====================================
      // Start
      // =====================================

      updateLanguage();

    });

  </script>

</body>
</html>
