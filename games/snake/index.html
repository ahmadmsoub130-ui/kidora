<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snake | ODDORA Arcade</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#070b14;
color:#fff;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:15px;
}

.game{
width:min(600px,100%);
text-align:center;
}

h1{
margin:0 0 10px;
}

.info{
display:flex;
justify-content:space-between;
background:#101827;
border:1px solid #1d2a40;
border-radius:14px;
padding:12px 18px;
margin-bottom:12px;
}

canvas{
width:100%;
max-width:500px;
aspect-ratio:1;
background:#050812;
border:2px solid #273754;
border-radius:16px;
display:block;
margin:auto;
touch-action:none;
}

button{
border:0;
border-radius:12px;
padding:13px 22px;
margin-top:15px;
font-size:16px;
font-weight:bold;
cursor:pointer;
background:#7c5cff;
color:white;
}

.controls{
display:grid;
grid-template-columns:repeat(3,65px);
gap:8px;
justify-content:center;
margin-top:15px;
}

.controls button{
margin:0;
padding:15px;
font-size:20px;
}

.empty{
visibility:hidden;
}
</style>
</head>

<body>

<div class="game">

<h1>🐍 Snake</h1>

<div class="info">
<span>النقاط: <strong id="score">0</strong></span>
<span>أفضل نتيجة: <strong id="best">0</strong></span>
</div>

<canvas id="game" width="500" height="500"></canvas>

<button id="start">
ابدأ اللعبة
</button>

<div class="controls">

<button class="empty"></button>
<button data-dir="up">⬆️</button>
<button class="empty"></button>

<button data-dir="left">⬅️</button>
<button data-dir="down">⬇️</button>
<button data-dir="right">➡️</button>

</div>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const scoreEl=document.getElementById("score");
const bestEl=document.getElementById("best");
const startBtn=document.getElementById("start");

const SIZE=25;
const CELL=canvas.width/SIZE;

let snake;
let food;
let direction;
let nextDirection;
let score=0;
let running=false;
let timer=null;

let best=Number(
localStorage.getItem("oddora_snake_best")||0
);

bestEl.textContent=best;

function reset(){

snake=[
{x:12,y:12},
{x:11,y:12},
{x:10,y:12}
];

direction={x:1,y:0};
nextDirection={x:1,y:0};

score=0;

scoreEl.textContent=score;

createFood();

}

function createFood(){

do{

food={
x:Math.floor(Math.random()*SIZE),
y:Math.floor(Math.random()*SIZE)
};

}
while(
snake.some(
part=>part.x===food.x&&part.y===food.y
)
);

}

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle="#070b14";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle="#ff5574";

ctx.beginPath();

ctx.arc(
food.x*CELL+CELL/2,
food.y*CELL+CELL/2,
CELL*0.35,
0,
Math.PI*2
);

ctx.fill();

snake.forEach(
(part,index)=>{

ctx.fillStyle=
index===0
?"#20d9ff"
:"#35df9a";

ctx.fillRect(
part.x*CELL+2,
part.y*CELL+2,
CELL-4,
CELL-4
);

}
);

}

function update(){

direction=nextDirection;

const head={
x:snake[0].x+direction.x,
y:snake[0].y+direction.y
};

if(
head.x<0||
head.x>=SIZE||
head.y<0||
head.y>=SIZE
){

gameOver();
return;

}

if(
snake.some(
(part,index)=>
index>0&&
part.x===head.x&&
part.y===head.y
)
){

gameOver();
return;

}

snake.unshift(head);

if(
head.x===food.x&&
head.y===food.y
){

score++;

scoreEl.textContent=score;

if(score>best){

best=score;

bestEl.textContent=best;

localStorage.setItem(
"oddora_snake_best",
best
);

}

createFood();

}else{

snake.pop();

}

draw();

}

function start(){

if(timer)
clearInterval(timer);

reset();

running=true;

startBtn.textContent="إعادة اللعب";

draw();

timer=setInterval(
update,
115
);

}

function gameOver(){

running=false;

clearInterval(timer);

timer=null;

ctx.fillStyle="rgba(0,0,0,.65)";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

ctx.fillStyle="#fff";

ctx.font="bold 32px Arial";

ctx.textAlign="center";

ctx.fillText(
"انتهت اللعبة",
canvas.width/2,
canvas.height/2-10
);

ctx.font="20px Arial";

ctx.fillText(
"النقاط: "+score,
canvas.width/2,
canvas.height/2+30
);

}

function changeDirection(dir){

if(!running)
return;

if(
dir==="up"&&
direction.y!==1
){

nextDirection={x:0,y:-1};

}

if(
dir==="down"&&
direction.y!==-1
){

nextDirection={x:0,y:1};

}

if(
dir==="left"&&
direction.x!==1
){

nextDirection={x:-1,y:0};

}

if(
dir==="right"&&
direction.x!==-1
){

nextDirection={x:1,y:0};

}

}

document.addEventListener(
"keydown",
e=>{

if(
e.key==="ArrowUp"||
e.key==="w"
){

changeDirection("up");

}

if(
e.key==="ArrowDown"||
e.key==="s"
){

changeDirection("down");

}

if(
e.key==="ArrowLeft"||
e.key==="a"
){

changeDirection("left");

}

if(
e.key==="ArrowRight"||
e.key==="d"
){

changeDirection("right");

}

}
);

document
.querySelectorAll("[data-dir]")
.forEach(
button=>{

button.addEventListener(
"click",
()=>{

changeDirection(
button.dataset.dir
);

}
);

}
);

startBtn.addEventListener(
"click",
start
);

reset();
draw();

</script>

</body>
</html>
